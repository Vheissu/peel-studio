name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Night Shift demo
        2. ...
  - type: input
    id: version
    attributes:
      label: Version
      description: Release number, or commit hash if you built from source.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Audio interface and buffer size
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash output
      render: text
