name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Faster cold builds and links, especially on Windows.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --all-targets
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.7"
      - name: Bundle Python and PyTheory
        run: uv run --no-project --python 3.12.13 scripts/bundle-python.py target/debug/python --replace
      - run: cargo test --workspace
      - name: Realtime allocation checks
        run: cargo test -p peel-engine --features rt-check
      - name: Verify bundled Python without system Python
        run: cargo test -p peel-cli --test bundled_python -- --ignored
      - run: cargo clippy --workspace --all-targets -- -D warnings
